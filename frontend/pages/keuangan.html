<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Keuangan - Egg Farm Management</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">
  <!-- Navbar -->
  <object type="text/html" data="../components/navbar.html" class="w-full"></object>

  <main class="flex-1 container mx-auto p-4">
    <h1 class="text-2xl font-semibold mb-4">Pencatatan Keuangan</h1>
    <!-- Form -->
    <form id="finance-form" class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6 bg-white p-4 rounded shadow">
      <div>
        <label class="block text-sm font-medium mb-1" for="tanggal">Tanggal</label>
        <input type="date" name="tanggal" id="tanggal" required class="w-full border rounded px-2 py-1" />
      </div>
      <div>
        <label class="block text-sm font-medium mb-1" for="tipe">Tipe</label>
        <select name="tipe" id="tipe" required class="w-full border rounded px-2 py-1">
          <option value="pemasukan">Pemasukan</option>
          <option value="pengeluaran">Pengeluaran</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium mb-1" for="jumlah">Jumlah (Rp)</label>
        <input type="number" name="jumlah" id="jumlah" required class="w-full border rounded px-2 py-1" />
      </div>
      <div>
        <label class="block text-sm font-medium mb-1" for="deskripsi">Deskripsi</label>
        <input type="text" name="deskripsi" id="deskripsi" class="w-full border rounded px-2 py-1" />
      </div>
      <div class="col-span-4 md:col-span-1 flex items-end">
        <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700 w-full">Tambah</button>
      </div>
    </form>

    <!-- Table -->
    <table id="finance-table" class="min-w-full bg-white rounded shadow overflow-hidden">
      <thead class="bg-gray-200">
        <tr>
          <th class="px-4 py-2 text-left">Tanggal</th>
          <th class="px-4 py-2 text-left">Tipe</th>
          <th class="px-4 py-2 text-left">Jumlah (Rp)</th>
          <th class="px-4 py-2 text-left">Deskripsi</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-100"></tbody>
    </table>

    <!-- Chart (Income vs Expense) -->
    <div class="mt-6 h-64">
      <canvas id="financeChart"></canvas>
    </div>
  </main>

  <!-- Footer -->
  <object type="text/html" data="../components/footer.html" class="w-full"></object>

  <script src="../js/main.js"></script>
</body>
</html>
