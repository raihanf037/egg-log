<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - Egg Farm Management</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">
  <!-- Navbar -->
  <nav class="bg-indigo-600 p-4 text-white flex justify-between items-center">
    <div class="text-lg font-bold">Egg Farm Management</div>
    <ul class="flex space-x-4">
      <li><a href="index.html" class="hover:underline">Dashboard</a></li>
      <li><a href="telur.html" class="hover:underline">Telur</a></li>
      <li><a href="pakan.html" class="hover:underline">Pakan</a></li>
      <li><a href="keuangan.html" class="hover:underline">Keuangan</a></li>
    </ul>
  </nav>

  <main class="flex-1 container mx-auto p-4">
    <h1 class="text-2xl font-semibold mb-4">Dashboard</h1>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
      <div class="bg-white rounded shadow p-4">
        <h2 class="font-medium">Total Telur Bulan Ini</h2>
        <p id="total-egg" class="text-3xl font-bold">0</p>
      </div>
      <div class="bg-white rounded shadow p-4">
        <h2 class="font-medium">Stok Pakan</h2>
        <p id="feed-stock" class="text-3xl font-bold">0 kg</p>
      </div>
      <div class="bg-white rounded shadow p-4">
        <h2 class="font-medium">Saldo Keuangan</h2>
        <p id="balance" class="text-3xl font-bold">Rp 0</p>
      </div>
    </div>
    <canvas id="eggChart" height="100"></canvas>
  </main>

  <!-- Footer -->
  <footer class="bg-gray-800 p-4 text-white text-center">
    © 2026 Egg Farm Management. All rights reserved.
  </footer>

  <script src="../js/main.js"></script>
  <script>
    // Render summary values from dummy data
    document.getElementById('total-egg').textContent = dummyData.egg.reduce((a, b) => a + b.jumlah, 0);
    document.getElementById('feed-stock').textContent = dummyData.feed.reduce((a, b) => a + b.jumlah_kg, 0) + ' kg';
    const income = dummyData.finance.filter(t => t.tipe === 'pemasukan').reduce((a, b) => a + b.jumlah, 0);
    const expense = dummyData.finance.filter(t => t.tipe === 'pengeluaran').reduce((a, b) => a + b.jumlah, 0);
    document.getElementById('balance').textContent = 'Rp ' + (income - expense);
    // Initialize chart
    initEggChart();
  </script>
</body>
</html>
